# Study 2: sandbox market (Smith-Suchanek-Williams 1988 design) with a call auction.
# Personas, memory and prompt-building are shared with Study 1.

study: study2
seed: 20261114            # dividend draws, endowment assignment, dummy agents
# Order design. v1 = first pilot: one buy/sell/hold order per agent per period. Every agent
# offered to sell from period 2 on and nobody bid, so the price froze at 240 while FV fell to
# 24. v2 = a two-sided quote every period (one buy and one sell limit order, buy limit < sell
# limit; a side may have quantity 0 only when it is infeasible). Outputs go to study2_<design>*
# (v1 keeps the plain study2* names), all sharing one cache.
design: v2

llm:
  backend: openai
  model: gpt-6-luna
  service_tier: flex
  reasoning_effort: low
  max_output_tokens: 800  # includes reasoning tokens
  max_incomplete_retries: 5  # incomplete replies are retried, never parsed or held;
                             # after this many in a row on one request the market run stops
  json_mode: true
  timeout_s: 900
  replicate_id: null
  price_per_mtok: {input: 0.05, cached_input: 0.05, output: 0.25}

budget:
  cap_usd: 6.00

agents:
  reflect_after: [5, 10]
  json_retries: 1

market:
  periods: 15
  dividends: [0, 8, 28, 60]     # equal probability, expected value 24
  # Every agent has the same total wealth at the period-1 fundamental value (FV1 = 24 x periods,
  # 360 for 15 periods); endowments differ in the cash/stock mix: cash = wealth - shares x FV1.
  # Call-auction tie-break after maximizing volume (README, "Call auction rule").
  # true (default): smallest |demand - supply|, then closest to the previous price, then lower
  #   price. Departs from the proposal on purpose: under one-sided order flow the literal rule
  #   froze the price at 360 while FV fell to 24.
  # false: the proposal's literal rule (closest to the previous price, then lower price).
  min_imbalance_tiebreak: true
  wealth: 3600
  endowment_shares: [2, 4, 6]   # assigned round-robin after a seeded shuffle

# A treatment cell fixes every factor. Baseline values:
baseline:
  n_agents: 30
  agent_mix: balanced           # key into agent_mixes
  memory: log                   # none | log | reflect (all agents in the market)
  price_limit: null             # null or a fraction, e.g. 0.10 = +/-10% of previous price
  transaction_tax: 0.0          # fraction of sale value, paid by the seller

agent_mixes:
  balanced: {young_active: 0.334, retiree: 0.333, experienced: 0.333}
  retail_heavy: {young_active: 0.6, retiree: 0.2, experienced: 0.2}

stages:
  pilot:                        # build-order step 5a
    cells:
      - {name: pilot, n_agents: 10, periods: 10, runs: 1}
  full:                         # one factor changed at a time; 20 market runs
    cells:
      - {name: baseline, runs: 5}
      - {name: memory_none, memory: none, runs: 3}
      - {name: memory_reflect, memory: reflect, runs: 3}
      - {name: retail_heavy, agent_mix: retail_heavy, runs: 3}
      - {name: price_limit_10, price_limit: 0.10, runs: 3}
      - {name: tax_0.3pct, transaction_tax: 0.003, runs: 3}

run:
  workers: 2                    # market runs in parallel
  agent_workers: 15             # agents deciding in parallel within one market period

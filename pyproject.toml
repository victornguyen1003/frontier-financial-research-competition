[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-investors"
version = "0.1.0"
description = "LLM investor agents: persona attributes, memory and the disposition effect"
requires-python = ">=3.11"
# Exact versions used for the competition runs are pinned in requirements.txt.
dependencies = [
    "openai>=3.50", "numpy", "pandas", "pyarrow", "scipy", "statsmodels", "matplotlib",
    "streamlit>=1.37", "rich", "PyYAML",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
run-study1 = "llm_investors.sim.run_study1:main"
build-dataset = "llm_investors.measure.dataset:cli"
analyze-study1 = "llm_investors.analysis.study1:cli"
power-study1 = "llm_investors.analysis.power:cli"
tag-reasoning = "llm_investors.analysis.reasoning:cli"
calibrate = "llm_investors.calibration.report:main"
investor-viewer = "llm_investors.app.launch:main"
cache-stats = "llm_investors.sim.cache_stats:main"
publish-logs = "llm_investors.sim.publish_logs:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

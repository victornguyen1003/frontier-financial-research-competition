[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-investors"
version = "0.1.0"
description = "LLM investor agents: memory and the disposition effect, and a sandbox call-auction market"
requires-python = ">=3.11"
# Exact versions used for the competition runs are pinned in requirements.txt.
dependencies = [
    "openai>=3.50", "numpy", "pandas", "pyarrow", "scipy", "statsmodels", "matplotlib",
    "streamlit>=1.37", "rich", "PyYAML",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
run-study1 = "llm_investors.sim.run_study1:main"
run-study2 = "llm_investors.sim.run_study2:main"
build-dataset = "llm_investors.measure.dataset:cli"
analyze-study1 = "llm_investors.analysis.study1:cli"
analyze-study2 = "llm_investors.analysis.study2:cli"
investor-viewer = "llm_investors.app.launch:main"
cache-stats = "llm_investors.sim.cache_stats:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
